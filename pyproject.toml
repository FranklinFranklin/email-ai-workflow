[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-ai-workflow"
version = "0.1.0"
description = "Zakelijke AI e-mail workflow met draft-only veiligheidsmodel"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.2.5",

    # Cache & queue
    "redis[hiredis]==5.0.4",
    "rq==1.16.2",

    # Validation & settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==42.0.5",

    # LLM
    "anthropic==0.25.1",
    "openai==1.25.0",        # fallback provider

    # Google API
    "google-auth==2.29.0",
    "google-auth-oauthlib==1.2.0",
    "google-api-python-client==2.128.0",

    # HTTP
    "httpx==0.27.0",

    # PII detection
    "presidio-analyzer==2.2.354",
    "presidio-anonymizer==2.2.354",
    "spacy==3.7.4",

    # Logging
    "structlog==24.1.0",

    # Utilities
    "python-dateutil==2.9.0",
    "tenacity==8.3.0",        # retry logic
    "ulid-py==1.1.0",         # sortable IDs
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==24.11.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "alembic/*", "docker/*"]
